<svg fill="none" viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="India Geo">
  <title>India Geo</title>
  <rect width="50" height="50" rx="12" fill="#2490EF"/>
  <defs><clipPath id="flagClip"><rect x="9" y="13" width="32" height="21.33" rx="3"/></clipPath></defs>
  <!-- Authentic Flag of India from Wikimedia Commons (commons.wikimedia.org/wiki/File:Flag_of_India.svg) — 3:2, viewBox -45 -30 90 60, embedded as nested svg clipped to rounded rect -->
  <g clip-path="url(#flagClip)">
    <svg x="9" y="13" width="32" height="21.33" viewBox="-45 -30 90 60" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
      <path fill="#FFF" d="m-45-30h90v60h-90z"/>
      <path fill="#FF9933" d="m-45-30h90v20h-90z"/>
      <path fill="#138808" d="m-45 10h90v20h-90z"/>
      <g fill="#000080">
        <circle r="9.25"/>
        <circle fill="#FFF" r="8"/>
        <circle r="1.6"/>
        <g id="d">
          <g id="c">
            <g id="b">
              <g id="a">
                <path d="m0-8 .3 4.81409L0-.80235-.3-3.18591z"/>
                <circle transform="rotate(7.5)" r="0.35" cy="-8"/>
              </g>
              <use xlink:href="#a" transform="scale(-1)"/>
            </g>
            <use xlink:href="#b" transform="rotate(15)"/>
          </g>
          <use xlink:href="#c" transform="rotate(30)"/>
        </g>
        <use xlink:href="#d" transform="rotate(60)"/>
        <use xlink:href="#d" transform="rotate(120)"/>
      </g>
    </svg>
  </g>
  <rect x="9" y="13" width="32" height="21.33" rx="3" fill="none" stroke="white" stroke-opacity="0.95" stroke-width="0.7"/>
</svg>
